name: flipforge

services:
  db:
    # TimescaleDB is PostgreSQL 16 plus the time-series extension, which the
    # candle and score-snapshot tables use as hypertables.
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    # The image only writes shared_preload_libraries during first-time
    # initialisation, so a data directory created by plain postgres would load
    # the image but not the extension. Setting it here works either way.
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flipforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flipforge}
      POSTGRES_DB: ${POSTGRES_DB:-flipforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flipforge} -d ${POSTGRES_DB:-flipforge}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Not published by default; the API reaches it over the compose network.
    # Uncomment to inspect the database from your host.
    # ports:
    #   - "5432:5432"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Pass the whole .env through, so every setting documented in .env.example
    # actually reaches the app. Listing variables individually here silently
    # drops any that were forgotten.
    env_file:
      - path: .env
        required: false
    environment:
      # Built from the POSTGRES_* values; the database is reachable as `db`
      # inside the compose network, so this always overrides any .env value.
      FF_DATABASE_URL: postgresql://${POSTGRES_USER:-flipforge}:${POSTGRES_PASSWORD:-flipforge}@db:5432/${POSTGRES_DB:-flipforge}
      # Required. The wiki rejects requests without a descriptive User-Agent,
      # and the API refuses to boot without one rather than failing obscurely.
      FF_CONTACT: ${FF_CONTACT:?set FF_CONTACT in .env to your email or Discord handle}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    # Uncomment to call the API directly from your host or your own scripts.
    # ports:
    #   - "8000:8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FF_PORT:-8090}:80"

volumes:
  pgdata:
